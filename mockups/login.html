<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Mockup - Login</title>
    <style>
        body { font-family: sans-serif; background: #f0f0f0; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; border: 2px solid #000; padding: 30px; width: 350px; }
        .title { text-align: center; font-size: 24px; font-weight: bold; margin-bottom: 20px; border-bottom: 2px solid #000; padding-bottom: 10px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .input-group input { width: 100%; padding: 10px; border: 2px solid #000; box-sizing: border-box; outline: none; }
        .btn-login { width: 100%; padding: 12px; background: #000; color: #fff; border: none; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
        /* Tambahan indikator error login */
        .error-msg { background: #fee2e2; color: #b91c1c; border: 1px solid #b91c1c; padding: 10px; margin-bottom: 15px; text-align: center; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="title">LOGIN ADMIN<br><small style="font-size: 14px;">Toko JeWePe</small></div>
        
        <div class="error-msg">Username atau Password salah!</div>

        <div class="input-group">
            <label>Username</label>
            <input type="text" placeholder="Masukkan username">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" placeholder="********">
        </div>
        <button class="btn-login">MASUK APLIKASI</button>
    </div>
</body>
</html>
